version: '3.8'

services:
  trading-agent:
    build: .
    container_name: ai-trading-agent
    command: uvicorn app.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      # Persist data (state, databases)
      - ./data:/data
      # Persist logs
      - ./logs:/app/logs
      # Mount .env file (optional, better to pass env vars explicitly in prod)
      - ./.env:/app/.env
    environment:
      - DATA_DIR=/data
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: ai-trading-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - trading-agent
